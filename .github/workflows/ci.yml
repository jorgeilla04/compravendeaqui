name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (test + lint)
    runs-on: ubuntu-latest
    # Los tests corren contra Postgres y Redis reales (migraciones de Alembic).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: compravende_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/compravende_test
      TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: black --check
        run: black --check app

      - name: isort --check
        run: isort --check-only app

      - name: flake8
        run: flake8 app

      - name: mypy
        run: mypy app

      - name: pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  design-audit:
    name: Design audit (Impeccable)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Escaneo estático: anti-patrones en el código fuente.
      - name: Impeccable detect (source)
        run: npx impeccable detect app components
      # Escaneo de la página renderizada: corre las reglas que necesitan DOM
      # (contraste, tamaño de texto). Usa el Chrome preinstalado del runner.
      # Cualquier finding hace fallar el job (exit != 0).
      - name: Impeccable detect (rendered page)
        run: |
          npx next start -p 3000 &
          npx --yes wait-on --timeout 60000 http://localhost:3000
          npx impeccable detect http://localhost:3000

  e2e:
    name: E2E (flujos críticos)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci
      E2E_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/compravende_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install tools (psql, redis-cli)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client redis-tools
      - name: Backend deps (+ moto como S3 de e2e)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -q -r backend/requirements.txt "moto[server]==5.2.5"
      - name: Frontend deps + Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start stack
        run: |
          e2e/start-stack.sh > stack.log 2>&1 &
          npx --yes wait-on --timeout 300000 http://localhost:3010 http://localhost:8010/health
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Stack log
        if: failure()
        run: tail -100 stack.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
