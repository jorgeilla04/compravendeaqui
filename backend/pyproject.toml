[project]
name = "compravendeaqui-backend"
version = "0.1.0"
description = "Backend FastAPI de CompraVendeAqui — marketplace local de San Juan"
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["app/tests/"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]
