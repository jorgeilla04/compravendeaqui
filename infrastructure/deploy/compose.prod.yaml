# CompraVendeAqui — producción en el VPS compartido (Contabo).
#
# Independiente de las otras suites del servidor: red, volúmenes, base,
# Redis y MinIO propios. Ningún servicio publica puertos en el host.
# El ÚNICO punto de contacto es `gateway`, que se une a la red externa
# `suite-turnos_edge` para que el Caddy de entrada le pase el tráfico de
# compravendeaqui.com.ar (ver Caddyfile.edge-snippet).
#
# deploy.sh lo copia a /opt/compravendeaqui/compose.yaml (rutas relativas a esa carpeta).
name: compravendeaqui

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    container_name: compravendeaqui-postgres
    environment:
      POSTGRES_DB: compravende
      POSTGRES_USER: compravende
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compravende -d compravende"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  redis:
    <<: *restart
    image: redis:7-alpine
    container_name: compravendeaqui-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  minio:
    <<: *restart
    # MinIO ya no publica imágenes en Docker Hub; Chainguard mantiene esta.
    image: cgr.dev/chainguard/minio:latest
    container_name: compravendeaqui-minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?falta S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?falta S3_SECRET_ACCESS_KEY}
      # Alias "local" para el healthcheck con mc.
      MC_HOST_local: http://${S3_ACCESS_KEY_ID}:${S3_SECRET_ACCESS_KEY}@localhost:9000
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  api:
    <<: *restart
    build:
      context: ./app/backend
    image: compravendeaqui-api:latest
    container_name: compravendeaqui-api
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://compravende:${POSTGRES_PASSWORD}@postgres:5432/compravende
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      # El gateway (red interna de Docker) es el único proxy de confianza.
      TRUSTED_PROXIES: 172.16.0.0/12
    command: >-
      sh -c "alembic upgrade head &&
      python -m app.scripts.setup_storage &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-server-header"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [interna]

  web:
    <<: *restart
    build:
      context: ./app/frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_SITE_URL}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
        NEXT_PUBLIC_MEDIA_URL: ${PUBLIC_SITE_URL}
    image: compravendeaqui-web:latest
    container_name: compravendeaqui-web
    environment:
      # SSR/ISR hablan con la API por la red interna.
      API_INTERNAL_URL: http://api:8000
    depends_on: [api]
    networks: [interna]

  gateway:
    <<: *restart
    image: caddy:2-alpine
    container_name: compravendeaqui-gateway
    volumes:
      - ./Caddyfile.gateway:/etc/caddy/Caddyfile:ro
    depends_on: [api, web, minio]
    networks: [interna, edge]

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  interna:
    name: compravendeaqui_interna
  edge:
    name: suite-turnos_edge
    external: true
