# Pre-commit hooks. Instalar con:  pip install pre-commit && pre-commit install
# Bloquea commits con código mal formateado o con errores de tipos/lint.
# Código de terceros (skill de Impeccable): no se reformatea.
exclude: ^\.claude/skills/

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^backend/

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
        files: ^backend/

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        files: ^backend/
        args: ["--config", "backend/.flake8"]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^backend/app/
        args: ["--config-file", "backend/pyproject.toml"]
        # El hook corre en un entorno aislado: mismas versiones que requirements.txt.
        additional_dependencies:
          - fastapi==0.115.6
          - pydantic==2.10.4
          - pydantic-settings==2.7.1
          - SQLAlchemy==2.0.36
          - redis==5.2.1
          - structlog==24.4.0
